<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Search & Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #343541;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chatbox {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .message {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            word-wrap: break-word;
            font-size: 16px;
        }
        .user {
            align-self: flex-end;
            background-color: #0a84ff;
        }
        .bot {
            align-self: flex-start;
            background-color: #444654;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #40414F;
            width: 100%;
            position: sticky;
            bottom: 0;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            background-color: #2E2F38;
            color: white;
        }
        .input-area button {
            margin-left: 10px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #0a84ff;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="chatbox" id="chatbox">
            <div class="message bot">What can I help with?</div>
        </div>

        <div class="input-area">
            <input type="text" id="query" placeholder="Ask anything">
            <button onclick="search()">Send</button>
        </div>
    </div>

    <script>
        function search() {
            const query = document.getElementById("query").value.trim();
            if (!query) {
                alert("Please enter a search query");
                return;
            }

            // Add user's message to chat
            addMessage(query, "user");
            document.getElementById("query").value = ""; // Clear input

            // Show "thinking" message
            const botMessage = addMessage("Thinking...", "bot");

            fetch(`chat.php?query=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    botMessage.innerText = "Error: " + data.error;
                } else {
                    botMessage.innerHTML = `
                        <strong>${data.title}</strong><br>
                        ${data.summary}<br>
                        <em>Keywords:</em> ${data.keywords.join(", ")}<br>
                        <a href="${data.source}" target="_blank">Read More</a>
                    `;
                }
            })
            .catch(error => {
                botMessage.innerText = "Error fetching summary.";
                console.error(error);
            });
        }

        function addMessage(text, sender) {
            const chatbox = document.getElementById("chatbox");
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", sender);
            messageDiv.innerText = text;
            chatbox.appendChild(messageDiv);

            chatbox.scrollTop = chatbox.scrollHeight; // Auto-scroll to latest message

            return messageDiv; // Return the message div (useful for updating later)
        }
    </script>

</body>
</html>
