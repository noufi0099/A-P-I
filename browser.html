<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Notification with PHP</title>
</head>
<body>
    <button onclick="requestNotificationPermission()">Enable Notifications</button>

    <script>
        // Request notification permission
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Notifications enabled!");
                    } else {
                        alert("Notifications blocked. Enable them in browser settings.");
                    }
                });
            } else {
                alert("Your browser does not support notifications.");
            }
        }

        // Function to show browser notification
        function showNotification(title, message) {
            if (Notification.permission === "granted") {
                new Notification(title, {
                    body: message,
                });
            }
        }

        // Fetch notification from the PHP backend
        function fetchNotification() {
            fetch("browser.php")
                .then(response => response.json())
                .then(data => {
                    if (data.title && data.message) {
                        showNotification(data.title, data.message);
                    }
                })
                .catch(error => console.error("Error fetching notification:", error));
        }

        // Fetch notification every 10 seconds
        setInterval(fetchNotification, 10000);
    </script>
</body>
</html>
